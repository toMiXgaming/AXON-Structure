# ============================================================
#  AXON-Structure – konfiguracja
#  Pliki struktur (*.axs) wrzuć do: plugins/AXON-Structure/struktury/
#  Po zmianach wpisz: /struktury przeladuj
#  Kolory w nazwach: &a, &6, &f itd.
# ============================================================

odswiezanie:
  # Co ile minut losować skrzynie na nowo.
  co-ile-minut: 20
  # Nie odświeżaj struktury, gdy jakiś gracz jest bliżej niż tyle bloków od jej środka (0 = wyłączone).
  blokada-gdy-gracz-blizej-niz: 32
  # false = losuj tylko puste i zniszczone skrzynie, pełne zostają; true = zawsze losuj od nowa.
  zastepuj-pelne: false

stawianie:
  # Ile bloków stawiać na tick (mniej = mniejsze lagi, dłużej trwa).
  bloki-na-tick: 4000
  # Szerokość pasa terenu wokół struktury, który łagodnie przechodzi do jej poziomu (bez klifów i rowów).
  wygladzanie-krawedzi: 6
  # Maks. głębokość dosypywania gruntu pod strukturą (łata dziury i jaskinie pod podłogą).
  maks-fundament: 24
  # Ile bloków ponad strukturą wycinać (drzewa, pagórki).
  czyszczenie-nad: 24

ochrona:
  # Gracze nie mogą niszczyć ani budować w obrębie struktury (cała wysokość świata, też pod ziemią).
  # Wolno: otwierać skrzynie, drzwi, przyciski i zabierać karty z ramek. PvP działa normalnie.
  # Admini z uprawnieniem axonstructure.bypass (domyślnie OP) mogą wszystko.
  wlaczona: true
  # Ile kratek wokół obrysu struktury też jest chronione.
  margines: 2
  # Minimalny odstęp (w kratkach) między strukturą a działką AxonPlot. Wymaga WorldGuarda.
  # Działa w obie strony: struktura nie powstanie przy działce, a działki nie da się założyć przy strukturze
  # (po stronie AxonPlot: placement.structure-buffer-blocks, ustaw tę samą wartość).
  odstep-od-dzialek: 50
  # Promień działki na najwyższym poziomie (AxonPlot: levels.*.radius). Działki rosną, więc liczy się największy.
  promien-dzialki: 25
  komunikat: "&cTej struktury nie można niszczyć ani rozbudowywać."
  # Flagi regionu WorldGuard struktura_<id>. Niszczenie blokuje sam plugin, więc passthrough zostaje
  # na allow (inaczej WorldGuard zablokowałby też otwieranie skrzyń), a pvp na allow włącza walkę.
  flagi-worldguard:
    pvp: allow
    passthrough: allow

auto-generowanie:
  wlaczone: true
  # Światy, w których struktury pojawiają się same.
  swiaty:
    - world
  # Szansa (w %) na próbę postawienia przy każdym NOWO wygenerowanym chunku.
  szansa-procent: 0.5
  # Minimalna odległość (w blokach) między dwiema strukturami.
  min-odleglosc-miedzy: 1000
  # Minimalna odległość od spawnu świata.
  min-odleglosc-od-spawnu: 300
  # Maks. różnica wysokości terenu pod strukturą. Większa = struktura stanie też na pagórkach.
  maks-roznica-wysokosci: 6
  # Maks. udział wody/lawy/lodu pod strukturą w %.
  maks-woda-procent: 3
  # Które struktury i jak często (wagi). Puste {} = wszystkie wczytane po równo.
  # Przykład:
  #   struktury:
  #     stacja: 3
  #     magazyn: 1
  struktury: {}

zrzuty:
  # Co losowy czas nad jedną z postawionych struktur spada na spadochronie skrzynia z rzadkim lootem.
  # Miejsca zrzutów są w plikach struktur (lądowisko jednostki, dach szpitala). Komenda: /struktury zrzut
  wlaczone: true
  # Odstęp między zrzutami: losowo od-do minut.
  co-ile-minut-od: 45
  co-ile-minut-do: 90
  # Zrzut tylko, gdy online jest co najmniej tylu graczy.
  min-graczy: 2
  # Pula lootu (sekcja pule:) i zarazem nazwa miejsc zrzutu w plikach .axs.
  pula: zrzut
  # Po ilu minutach nieopróżniona skrzynia znika.
  znika-po-minutach: 15
  wysokosc-spadania: 40
  czas-spadania-sekund: 10
  nazwa-skrzyni: "&4&lZrzut zaopatrzenia"
  # {nazwa} = nazwa struktury, {x} {y} {z} = współrzędne, {minuty} = znika-po-minutach. "" = bez komunikatu.
  komunikat: "&4&l[ZRZUT] &fNad strukturą &e{nazwa} &fspada skrzynia z zaopatrzeniem! &7({x}, {y}, {z})"
  komunikat-wyladowal: "&4&l[ZRZUT] &fSkrzynia wylądowała. Zniknie za &e{minuty} min&f."
  komunikat-zniknal: "&4&l[ZRZUT] &7Nikt nie zabrał zrzutu, skrzynia zniknęła."

# ------------------------------------------------------------
#  PULE – w pliku struktury każde miejsce na skrzynię ma nazwę puli.
#  Pula losuje klasę skrzyni według wag. "brak" = w tym miejscu nic się nie pojawi.
# ------------------------------------------------------------
pule:
  paliwo:
    beczka-paliwa: 65
    beczka: 20
    brak: 15
  plac:
    beczka: 65
    beczka-paliwa: 10
    brak: 25
  lada:
    skrzynka-jedzenie: 70
    brazowa: 15
    brak: 15
  karta:
    zielona-karta: 85
    brak: 15
  sklep:
    skrzynka-jedzenie: 40
    brazowa: 35
    brak: 25
  lodowki:
    skrzynka-medyczna: 45
    skrzynka-jedzenie: 35
    brak: 20
  toalety:
    skrzynka-medyczna: 45
    skrzynka-jedzenie: 30
    brak: 25
  zaplecze:
    brazowa: 45
    skrzynka-medyczna: 20
    skrzynka-jedzenie: 15
    brak: 20
  magazyn-regal:
    brazowa: 70
    narzedziowa: 15
    brak: 15
  magazyn:
    beczka: 60
    brazowa: 15
    brak: 25
  dach:
    brazowa: 45
    narzedziowa: 35
    brak: 20
  # --- gospodarstwo Agro-Pol (beczki na podwórzu i przy bece paliwowej: pule plac i paliwo) ---
  # parter domu
  parter:
    mala-skrzynka: 50
    skrzynka-jedzenie: 25
    skrzynka-medyczna: 10
    brak: 15
  # klepisko stodoły
  klepisko:
    mala-skrzynka: 55
    narzedziowa: 15
    brak: 30
  # strych stodoły (parkour po kombajnie)
  strych:
    lepsza-skrzynia: 70
    brazowa: 15
    brak: 15
  # piętro domu (przez szopę i balkon)
  pietro:
    lepsza-skrzynia: 70
    skrzynka-medyczna: 15
    brak: 15
  # szczyt silosu – pojedyncza rzadka skrzynia
  silos:
    rzadka-skrzynia: 90
    lepsza-skrzynia: 10
  # --- kombinat Przyszłość (beczki: plac, paliwo; małe skrzynki: parter, klepisko; piętro paszarni: strych) ---
  # magazyn nawozów – jedyne pewne skrzynki medyczne
  magazyn-nawozow:
    skrzynka-medyczna: 60
    narzedziowa: 25
    brak: 15
  # pomost suwnicy w bazie maszynowej
  suwnica:
    lepsza-skrzynia: 65
    narzedziowa: 20
    brak: 15
  # pomost wieży ciśnień
  wieza:
    lepsza-skrzynia: 75
    brazowa: 10
    brak: 15
  # maszynownia na szczycie wieży elewatora – dwie rzadkie skrzynie
  elewator:
    rzadka-skrzynia: 85
    lepsza-skrzynia: 15
  # --- kopalnia Jedność (beczki: plac, paliwo; cechownia i portiernia: parter; najwyższe piętro sortowni: strych) ---
  # sztolnia w hałdzie – skrzynki narzędziowe w komorze na końcu chodnika
  sztolnia:
    narzedziowa: 60
    mala-skrzynka: 15
    brak: 25
  # podszybie i komora pomp pod ziemią (jedyne wyjście to drabina w szybie)
  podszybie:
    narzedziowa: 55
    mala-skrzynka: 15
    lepsza-skrzynia: 10
    brak: 20
  # skład materiałów wybuchowych za kratą w podszybiu
  podszybie-sklad:
    lepsza-skrzynia: 75
    narzedziowa: 10
    brak: 15
  # pulpit maszynisty w maszynowni wyciągowej
  maszynownia:
    lepsza-skrzynia: 70
    narzedziowa: 15
    brak: 15
  # budka na szczycie wieży szybowej
  wieza-szybowa:
    rzadka-skrzynia: 90
    lepsza-skrzynia: 10
  # --- jednostka wojskowa (beczki: plac, paliwo; koszary, kantyna, magazyny: parter, lada, klepisko;
  #     strych garaży i regały magazynu sprzętu: strych; wieża desantowa na torze przeszkód: wieza) ---
  # izba chorych – szafki z lekami
  izba-chorych:
    skrzynka-medyczna: 70
    mala-skrzynka: 10
    brak: 20
  # gabinet dowódcy i kancelaria tajna w sztabie
  sztab:
    lepsza-skrzynia: 55
    skrzynia-broni: 15
    brazowa: 15
    brak: 15
  # cztery wieże wartownicze w rogach ogrodzenia
  wieze-wartownicze:
    skrzynia-broni: 45
    lepsza-skrzynia: 35
    brak: 20
  # wrak Mi-8 na lądowisku
  wrak:
    skrzynia-broni: 40
    skrzynka-medyczna: 30
    narzedziowa: 15
    brak: 15
  # kosz dźwigu nad placem
  dzwig:
    lepsza-skrzynia: 70
    narzedziowa: 15
    brak: 15
  # schron, poziom 1 – sala dowodzenia i pokój szyfranta
  schron-1:
    lepsza-skrzynia: 50
    skrzynia-broni: 25
    skrzynka-medyczna: 10
    brak: 15
  # bunkry magazynu uzbrojenia za siatką
  magazyn-broni:
    skrzynia-broni: 60
    brazowa: 20
    brak: 20
  # zbrojownia za kratą na poziomie 2 schronu
  zbrojownia:
    skrzynia-broni: 80
    lepsza-skrzynia: 10
    brak: 10
  # pomost na szczycie komina kotłowni
  komin:
    rzadka-skrzynia: 85
    lepsza-skrzynia: 15
  # kabina wieży kontroli lotów
  wieza-lotow:
    rzadka-skrzynia: 85
    skrzynia-broni: 15
  # skarbiec na dnie schronu (tylko przez szyb wentylacyjny)
  skarbiec:
    rzadka-skrzynia: 100
  # --- szpital Pod Lipami (beczki: plac; sale i gabinety: parter, izba-chorych; kuchnia: lada) ---
  # apteka szpitalna (tylko kanałem wentylacyjnym z dachu pawilonu)
  apteka:
    lepsza-skrzynia: 45
    skrzynka-medyczna: 45
    brak: 10
  # blok operacyjny (tylko łącznikiem z 1 piętra)
  blok-operacyjny:
    lepsza-skrzynia: 55
    skrzynka-medyczna: 30
    brak: 15
  # gabinet dyrektora na 4 piętrze (szyb windy albo właz z dachu)
  dyrekcja:
    lepsza-skrzynia: 75
    brazowa: 10
    brak: 15
  # kostnica w piwnicy
  kostnica:
    lepsza-skrzynia: 60
    skrzynka-medyczna: 20
    brak: 20
  # lądowisko na dachu
  ladowisko:
    rzadka-skrzynia: 85
    lepsza-skrzynia: 15
  # zrzut zaopatrzenia (sekcja zrzuty: wskazuje tę pulę)
  zrzut:
    rzadka-skrzynia: 75
    skrzynia-broni: 25

# ------------------------------------------------------------
#  KLASY SKRZYŃ
#  blok: skrzynia | beczka | ramka (ramka = przedmiot w ramce, np. karta dostępu)
#  dekoracja: blok stawiany na wieku (np. czerwona świeczka na beczce paliwa), "" = brak
#  min-przedmiotow: gdy nic nie wylosuje się z szans, dobierz tyle losowych pozycji
#  loot: każda pozycja losowana osobno
#    przedmiot: nazwa z Minecrafta (np. iron_ingot)
#    ilosc: "4-14" albo "1"
#    szansa: w % (0-100)
#    nazwa / opis: opcjonalna nazwa i opis przedmiotu
# ------------------------------------------------------------
klasy:
  beczka:
    nazwa: "&6Beczka"
    blok: beczka
    min-przedmiotow: 1
    loot:
      - {przedmiot: iron_nugget, ilosc: "4-14", szansa: 100, nazwa: "&fZłom"}
      - {przedmiot: copper_ingot, ilosc: "1-4", szansa: 50}
      - {przedmiot: iron_ingot, ilosc: "1-2", szansa: 30}
      - {przedmiot: chain, ilosc: "1-2", szansa: 20, nazwa: "&fRura metalowa"}
      - {przedmiot: redstone, ilosc: "1-4", szansa: 25}
      - {przedmiot: gunpowder, ilosc: "1-2", szansa: 15}
      - {przedmiot: string, ilosc: "1-3", szansa: 20, nazwa: "&fLina"}

  beczka-paliwa:
    nazwa: "&cBeczka paliwa"
    blok: beczka
    dekoracja: "red_candle[candles=1,lit=false]"
    min-przedmiotow: 1
    loot:
      - {przedmiot: coal, ilosc: "4-12", szansa: 100, nazwa: "&fPaliwo niskiej jakości"}
      - {przedmiot: charcoal, ilosc: "2-6", szansa: 50}
      - {przedmiot: iron_nugget, ilosc: "2-6", szansa: 40, nazwa: "&fZłom"}
      - {przedmiot: lava_bucket, ilosc: "1", szansa: 8, nazwa: "&fRopa naftowa"}
      - {przedmiot: blaze_powder, ilosc: "1", szansa: 5}

  brazowa:
    nazwa: "&6Brązowa skrzynia"
    blok: skrzynia
    min-przedmiotow: 2
    loot:
      - {przedmiot: iron_nugget, ilosc: "6-20", szansa: 100, nazwa: "&fZłom"}
      - {przedmiot: iron_ingot, ilosc: "1-4", szansa: 50}
      - {przedmiot: gold_nugget, ilosc: "2-8", szansa: 30}
      - {przedmiot: redstone, ilosc: "2-8", szansa: 30}
      - {przedmiot: torch, ilosc: "2-8", szansa: 30}
      - {przedmiot: arrow, ilosc: "4-12", szansa: 30}
      - {przedmiot: chain, ilosc: "1-3", szansa: 20, nazwa: "&fRura metalowa"}
      - {przedmiot: bow, ilosc: "1", szansa: 10}
      - {przedmiot: stone_axe, ilosc: "1", szansa: 12}
      - {przedmiot: iron_pickaxe, ilosc: "1", szansa: 8}
      - {przedmiot: leather_chestplate, ilosc: "1", szansa: 10}
      - {przedmiot: iron_sword, ilosc: "1", szansa: 6}
      - {przedmiot: crossbow, ilosc: "1", szansa: 5}

  skrzynka-jedzenie:
    nazwa: "&aSkrzynka z jedzeniem"
    blok: beczka
    min-przedmiotow: 1
    loot:
      - {przedmiot: bread, ilosc: "1-3", szansa: 60}
      - {przedmiot: apple, ilosc: "1-4", szansa: 50}
      - {przedmiot: baked_potato, ilosc: "1-3", szansa: 40}
      - {przedmiot: carrot, ilosc: "1-4", szansa: 40}
      - {przedmiot: dried_kelp, ilosc: "3-8", szansa: 30, nazwa: "&fSuszone wodorosty"}
      - {przedmiot: cookie, ilosc: "2-6", szansa: 30}
      - {przedmiot: mushroom_stew, ilosc: "1", szansa: 15, nazwa: "&fPuszka gulaszu"}
      - {przedmiot: honey_bottle, ilosc: "1", szansa: 10}
      - {przedmiot: golden_carrot, ilosc: "1-2", szansa: 8}

  skrzynka-medyczna:
    nazwa: "&bSkrzynka medyczna"
    blok: beczka
    min-przedmiotow: 1
    loot:
      - {przedmiot: paper, ilosc: "1-4", szansa: 60, nazwa: "&fBandaż"}
