        - {przedmiot: "axon:stock", ilosc: "1", szansa: 30}
        - {przedmiot: "axon:screw", ilosc: "2-5", szansa: 40}
        - {przedmiot: "axon:gunpowder", ilosc: "2-6", szansa: 35}
        - {przedmiot: "axon:body_pistol", ilosc: "1", szansa: 12}
        - {przedmiot: "axon:pump_mechanism", ilosc: "1", szansa: 10}
        - {przedmiot: "axon:body_smg", ilosc: "1", szansa: 6}
        - {przedmiot: shield, ilosc: "1", szansa: 15}
        - {przedmiot: spyglass, ilosc: "1", szansa: 8, nazwa: "&fLornetka"}

    narzedziowa:
      nazwa: "&eSkrzynka narzędziowa"
