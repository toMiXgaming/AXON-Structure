        - {przedmiot: "axon:pump_mechanism", ilosc: "1", szansa: 8}
        - {przedmiot: golden_apple, ilosc: "1-2", szansa: 25, nazwa: "&fApteczka"}
        - {przedmiot: ender_pearl, ilosc: "1", szansa: 10}

    # czarny rynek: części do broni, ale nigdy korpusy T3
    skrzynia-broni:
      nazwa: "&2Skrzynia z częściami broni"
      blok: model
      model: "axon:skrzynia_drewniana"
      min-przedmiotow: 2
      loot:
