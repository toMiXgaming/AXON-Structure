      - {przedmiot: golden_apple, ilosc: "1-2", szansa: 30, nazwa: "&fApteczka"}
      - {przedmiot: crossbow, ilosc: "1", szansa: 30}
      - {przedmiot: iron_chestplate, ilosc: "1", szansa: 30}
      - {przedmiot: iron_leggings, ilosc: "1", szansa: 25}
      - {przedmiot: gunpowder, ilosc: "3-8", szansa: 30}
      - {przedmiot: spyglass, ilosc: "1", szansa: 25, nazwa: "&fLornetka"}
      - {przedmiot: ender_pearl, ilosc: "1-2", szansa: 20}
      - {przedmiot: emerald, ilosc: "1-3", szansa: 20}
