# ============================================================
#  AXON-Structure – konfiguracja
#  Pliki struktur (*.axs) wrzuć do: plugins/AXON-Structure/struktury/
#  Po zmianach wpisz: /struktury przeladuj
#  Kolory w nazwach: &a, &6, &f itd.
# ============================================================

odswiezanie:
  # Co ile minut losować skrzynie na nowo.
  co-ile-minut: 20
  # Nie odświeżaj struktury, gdy jakiś gracz jest bliżej niż tyle bloków od jej środka (0 = wyłączone).
  blokada-gdy-gracz-blizej-niz: 32
  # false = losuj tylko puste i zniszczone skrzynie, pełne zostają; true = zawsze losuj od nowa.
  zastepuj-pelne: false

stawianie:
  # Ile bloków stawiać na tick (mniej = mniejsze lagi, dłużej trwa).
  bloki-na-tick: 4000
  # Szerokość pasa terenu wokół struktury, który łagodnie przechodzi do jej poziomu (bez klifów i rowów).
  wygladzanie-krawedzi: 6
  # Maks. głębokość dosypywania gruntu pod strukturą (łata dziury i jaskinie pod podłogą).
  maks-fundament: 24
  # Ile bloków ponad strukturą wycinać (drzewa, pagórki).
  czyszczenie-nad: 24

# Meble z paczki zasobów serwera (QualityArmory-texturepack). Przy stawianiu struktury te bloki zamieniają się
# na niewidzialną barierę, a w ich miejscu staje model (obrócony jak blok). "" = zwykły blok z Minecrafta.
meble:
  lozko: "axon:lozko"
  bloki:
    bookshelf: "axon:regal"              # metalowy regał z segregatorami
    chiseled_bookshelf: "axon:kartoteka" # szafa kartotekowa
    cauldron: "axon:umywalka"            # umywalka z kranem
    water_cauldron: "axon:umywalka"
    crafting_table: "axon:warsztat"      # stół warsztatowy z imadłem
    smoker: "axon:kuchenka"              # stara kuchenka gazowa
    furnace: "axon:piecyk"               # żeliwna koza
    observer: "axon:radiostacja"         # wojskowa radiostacja
    lectern: "axon:biurko"               # biurko ze starym komputerem
    brewing_stand: "axon:kroplowka"      # stojak z kroplówką
    composter: "axon:kosz"               # blaszany kosz na śmieci
    grindstone: "axon:szlifierka"        # szlifierka stołowa
    # Do sklepów, stacji, fastfoodu, osiedla, zajezdni, elektrowni i galerii. Lodówka i dystrybutor mają
    # dwie kratki wysokości: nad blokiem w strukturze stoi minecraft:barrier.
    ender_chest: "axon:kasa"             # kasa fiskalna (stawiana na ladzie)
    jack_o_lantern: "axon:lada"          # lada sklepowa z witryną
    end_portal_frame: "axon:kibel"       # kompakt WC ze spłuczką
    bee_nest: "axon:regal_sklepowy"      # regał z puszkami, słoikami i kartonami
    calibrated_sculk_sensor: "axon:lodowka" # przeszklona lodówka na napoje
    damaged_anvil: "axon:dystrybutor"    # dystrybutor paliwa
    sticky_piston: "axon:rozdzielnia"    # szafa elektryczna
    vault: "axon:frytkownica"            # frytkownica gastronomiczna
    respawn_anchor: "axon:kanistry"      # sterta kanistrów
    lodestone: "axon:wozek"              # porzucony wózek sklepowy
    loom: "axon:telewizor"               # telewizor z kineskopem (blokowisko)
  # Drzwi zostają prawdziwymi drzwiami (otwierają się), model idzie za nimi przy otwieraniu.
  drzwi:
    spruce_door: "axon:drzwi_drewniane"
    birch_door: "axon:drzwi_drewniane"
    dark_oak_door: "axon:drzwi_drewniane"
    iron_door: "axon:drzwi_stalowe"
  # Struktury, w których meble zostają zwykłe (np. kolorowe łóżka w oazie).
  bez-zamiany: [oaza]

ochrona:
  # Gracze nie mogą niszczyć ani budować w obrębie struktury (cała wysokość świata, też pod ziemią).
  # Wolno: otwierać skrzynie, drzwi, przyciski i zabierać karty z ramek. PvP działa normalnie.
  # Admini z uprawnieniem axonstructure.bypass (domyślnie OP) mogą wszystko.
  wlaczona: true
  # Ile kratek wokół obrysu struktury też jest chronione.
  margines: 2
  # Minimalny odstęp (w kratkach) między strukturą a działką AxonPlot. Wymaga WorldGuarda.
  # Działa w obie strony: struktura nie powstanie przy działce, a działki nie da się założyć przy strukturze
  # (po stronie AxonPlot: placement.structure-buffer-blocks, ustaw tę samą wartość).
  odstep-od-dzialek: 50
  # Promień działki na najwyższym poziomie (AxonPlot: levels.*.radius). Działki rosną, więc liczy się największy.
  promien-dzialki: 25
  komunikat: "&cTej struktury nie można niszczyć ani rozbudowywać."
  # Flagi regionu WorldGuard struktura_<id>. Niszczenie blokuje sam plugin, więc passthrough zostaje
  # na allow (inaczej WorldGuard zablokowałby też otwieranie skrzyń), a pvp na allow włącza walkę.
  # Region kopalni (struktury z żyłami punkt-ruda) dostaje sam block-break: allow, żeby WorldGuard nie blokował
  # kopania rud – chyba że wpiszesz tu block-break sam.
  flagi-worldguard:
    pvp: allow
    passthrough: allow

auto-generowanie:
  wlaczone: true
  # Światy, w których struktury pojawiają się same.
  swiaty:
    - world
  # Szansa (w %) na próbę postawienia przy każdym NOWO wygenerowanym chunku.
  szansa-procent: 0.5
  # Minimalna odległość (w blokach) między dwiema strukturami.
  min-odleglosc-miedzy: 1000
  # Minimalna odległość od spawnu świata.
  min-odleglosc-od-spawnu: 300
  # Maks. różnica wysokości terenu pod strukturą. Większa = struktura stanie też na pagórkach.
  maks-roznica-wysokosci: 6
  # Maks. udział wody/lawy/lodu pod strukturą w %.
  maks-woda-procent: 3
  # Pomija teren, na którym gracze spędzili już łącznie więcej ticków (20 = 1 s), żeby nie postawić struktury
  # na czyjejś bazie, gdy nowy chunk pojawi się obok starego. 0 = bez sprawdzania.
  maks-czas-graczy-w-chunku: 1200
  # Które struktury i jak często (wagi). Puste {} = wszystkie wczytane po równo.
  # Przykład:
  #   struktury:
  #     oilen: 3
  #     magazyn: 1
  struktury: {}

zrzuty:
  # Kilka razy dziennie, o losowej porze w podanych godzinach, nad jedną z postawionych struktur spada
  # na spadochronie skrzynia z rzadkim lootem. Miejsca zrzutów są w plikach struktur (lądowisko jednostki,
  # dach szpitala, dach galerii). Komenda: /struktury zrzut teraz (od razu), /struktury zrzut (o której następny).
  wlaczone: true
  # Ile zrzutów dziennie. Okno godzin dzielone jest na tyle równych części, w każdej jeden zrzut o losowej porze
  # (przy 2 i 12-22: raz między 12 a 17, raz między 17 a 22).
  dziennie: 2
  godziny-od: 12
  godziny-do: 22
  strefa-czasowa: Europe/Warsaw
  # Zrzut tylko, gdy online jest co najmniej tylu graczy (czeka do końca swojej części okna, potem przepada).
  min-graczy: 2
  # Pula lootu (sekcja pule:) i zarazem nazwa miejsc zrzutu w plikach .axs.
  pula: zrzut
  # Po ilu minutach nieopróżniona skrzynia znika.
  znika-po-minutach: 15
  # Skrzynia spada powoli na spadochronie z tej wysokości (bloki nad miejscem lądowania) przez tyle sekund.
  wysokosc-spadania: 60
  czas-spadania-sekund: 45
  nazwa-skrzyni: "&4&lZrzut zaopatrzenia"
  # {nazwa} = nazwa struktury, {x} {y} {z} = współrzędne, {minuty} = znika-po-minutach. "" = bez komunikatu.
  # Domyślnie komunikat nie zdradza miejsca: wie to tylko radiostacja w oazie (za opłatą, sekcja oaza.radio).
  # Miejsce w komunikacie: "&4&l[ZRZUT] &fNad strukturą &e{nazwa} &fspada skrzynia z zaopatrzeniem! &7({x}, {y}, {z})"
  komunikat: "&4&l[ZRZUT] &fNad jedną ze struktur spada skrzynia z zaopatrzeniem! &7Gdzie? Radiostacja w oazie wie."
  komunikat-wyladowal: "&4&l[ZRZUT] &fSkrzynia wylądowała. Zniknie za &e{minuty} min&f."
  komunikat-zniknal: "&4&l[ZRZUT] &7Nikt nie zabrał zrzutu, skrzynia zniknęła."
  # Zrzut widać z daleka (miejsca dalej nie ma na czacie): za spadającą skrzynią smuga czerwonego dymu, a nad
  # wylądowaną wysoki czerwony słup dymu (widoczny do ~500 bloków), czerwony fajerwerk i huk przy lądowaniu
  # (słychać w promieniu 300 bloków, z kierunku zrzutu).
  dym-sygnalowy: true
  # Co ile sekund nad skrzynią wybucha czerwona flara (0 = bez flar).
  flara-co-sekund: 5
  # Spadająca skrzynia i spadochron świecą na czerwono (obrys widać przez ściany).
  swiecenie: true

straznicy:
  # Strażnicy NPC w strukturach (żołnierze w jednostce, szabrownicy w szpitalu). Wymagają pluginów Citizens
  # i Sentinel (darmowe: ci.citizensnpcs.co). Broń z QualityArmory: "qa:<nazwa broni z QA>"; gdy QA jej nie zna,
  # strażnik dostaje kuszę. Bez Citizens i Sentinela miejsca strażników zostają puste.
  # Komenda: /struktury straznicy (ilu stoi), /struktury straznicy postaw (od razu, bez czekania na graczy).
  wlaczeni: true
  # Strażnicy pojawiają się, gdy gracz podejdzie bliżej niż tyle bloków do środka struktury,
  # i znikają, gdy nikogo nie ma w 1,5 × tej odległości (nie obciążają serwera, gdy nikt nie gra w okolicy).
  promien-aktywacji: 64
  # Po ilu minutach zabity strażnik wraca na swoje miejsce.
  odradzanie-minut: 10
  # celnosc: rozrzut strzałów – 0 = trafia zawsze; przy broni QualityArmory mnoży rozrzut samej broni,
  # więc już 1 to sporo pudeł, a 3+ to strzelanie prawie na ślepo
  zestawy:
    zolnierz:
      nazwa: "&2Żołnierz"
      # Skin z mineskin.org: "Texture Value" i "Texture Signature". Albo skin-gracza: nick gracza z takim skinem.
      skin-tekstura: ""
      skin-podpis: ""
      skin-gracza: ""
      bron: "qa:ak47"
      # hełm, napierśnik, spodnie, buty
      zbroja: [iron_helmet, chainmail_chestplate, chainmail_leggings, iron_boots]
      zycie: 30
      # -1 = obrażenia broni
      obrazenia: -1
      # z jakiej odległości widzi i strzela
      zasieg: 28
      # rozrzut strzałów: 0 = idealnie celny, im więcej, tym częściej pudłuje
      celnosc: 0.8
      # klasa skrzyni (sekcja klasy:), z której losuje się loot po zabiciu; "" = nic
      loot: lepsza-skrzynia
      # do kogo strzela: players (gracze), monsters (potwory); [] = nie walczy wcale
      cele: [players]
      # czy chodzi po okolicy, gdy nie walczy (domyślnie tak, handlarz i paser stoją za ladą), i jak daleko
      # od swojego miejsca w strukturze może odejść (w blokach)
      chodzi: true
      promien-chodzenia: 8
    szabrownik:
      nazwa: "&6Szabrownik"
      skin-tekstura: ""
      skin-podpis: ""
      skin-gracza: ""
      bron: "qa:remington"
      zbroja: [leather_helmet, leather_chestplate, air, leather_boots]
      zycie: 24
      obrazenia: -1
      zasieg: 20
      celnosc: 1.2
      loot: mala-skrzynka
      # do kogo strzela: players (gracze), monsters (potwory); [] = nie walczy wcale
      cele: [players]
    cpun:
      # łatwy przeciwnik (apteka): bez pancerza, mało życia, bije pałką z bliska
      nazwa: "&7Ćpun"
      skin-tekstura: ""
      skin-podpis: ""
      skin-gracza: ""
      bron: "wooden_sword"
      zbroja: [air, air, air, air]
      zycie: 14
      obrazenia: 3
      zasieg: 4
      celnosc: 0
      loot: mala-skrzynka
      cele: [players]
    ochroniarz:
      # strażnik oazy: broni przed potworami, do graczy nie strzela i nie da się go zranić
      nazwa: "&aOchrona Oazy"
      skin-tekstura: ""
      skin-podpis: ""
      skin-gracza: ""
      bron: "qa:m4a1s"
      zbroja: [iron_helmet, iron_chestplate, leather_leggings, iron_boots]
      zycie: 40
      obrazenia: -1
      zasieg: 24
      celnosc: 0.4
      loot: ""
      cele: [monsters]
    handlarz:
      # handlarz w sklepie oazy (punkt-handlarz): stoi za ladą, prawy klik otwiera sklep
      nazwa: "&6Handlarz Zdzich"
      skin-tekstura: ""
      skin-podpis: ""
      skin-gracza: ""
      bron: ""
      zbroja: [air, leather_chestplate, air, air]
      zycie: 20
      obrazenia: -1
      zasieg: 0
      celnosc: 0
      loot: ""
      cele: []
    paser:
      # paser w kryjówce czarnego rynku (punkt-czarny-rynek): stoi za ladą, nie walczy, nie da się go zranić
      nazwa: "&8Paser"
      skin-tekstura: ""
      skin-podpis: ""
      skin-gracza: ""
      bron: ""
      zbroja: [leather_helmet, leather_chestplate, air, air]
      zycie: 20
      obrazenia: -1
      zasieg: 0
      celnosc: 0
      loot: ""
      cele: []
    osadnik:
      # osadnik w oazie (npc-osadnik): uprawia ogródki – podchodzi do dojrzałych roślin, zbiera je i sadzi od nowa
      nazwa: "&aOsadnik"
      skin-tekstura: ""
      skin-podpis: ""
      skin-gracza: ""
      bron: "iron_hoe"
      zbroja: [leather_helmet, air, leather_leggings, leather_boots]
      zycie: 20
      obrazenia: -1
      zasieg: 0
      celnosc: 0
      loot: ""
      cele: []
      chodzi: true
      promien-chodzenia: 6
      uprawia: true
    ocalaly:
      # ocalały w oazie (npc-ocalaly): chodzi po okolicy, przy kuchni, ognisku i po korytarzach noclegowni
      nazwa: "&7Ocalały"
      skin-tekstura: ""
      skin-podpis: ""
      skin-gracza: ""
      bron: ""
      zbroja: [air, leather_chestplate, air, air]
      zycie: 20
      obrazenia: -1
      zasieg: 0
      celnosc: 0
      loot: ""
      cele: []
      chodzi: true
      promien-chodzenia: 6
    spiacy:
      # śpiący w noclegowni (npc-spiacy): leży w najbliższym łóżku, nie chodzi
      nazwa: "&7Ocalały"
      skin-tekstura: ""
      skin-podpis: ""
      skin-gracza: ""
      bron: ""
      zbroja: [air, air, air, air]
      zycie: 20
      obrazenia: -1
      zasieg: 0
      celnosc: 0
      loot: ""
      cele: []
