# ------------------------------------------------------------
#  KLASY SKRZYŃ
#  blok: skrzynia | beczka | ramka (ramka = przedmiot w ramce, np. karta dostępu)
#  dekoracja: blok stawiany na wieku (np. czerwona świeczka na beczce paliwa), "" = brak
#  model: model przedmiotu z paczki zasobów rysowany zamiast bloku (np. "axon:zrzut"), "" = zwykły blok
#  min-przedmiotow: gdy nic nie wylosuje się z szans, dobierz tyle losowych pozycji
#  loot: każda pozycja losowana osobno
#    przedmiot: nazwa z Minecrafta (np. iron_ingot)
#    ilosc: "4-14" albo "1"
#    szansa: w % (0-100)
#    nazwa / opis: opcjonalna nazwa i opis przedmiotu
# ------------------------------------------------------------
klasy:
  # Skrzynie, beczki i szafki są w pojemniki.klasy (modele bez bloku). Tutaj zostają zrzut i karta w ramce.
  # Klasa o tym samym id w pojemniki.klasy zastępuje tę stąd.

  # Model z paczki QualityArmory-texturepack (axon:zrzut); beczka w środku jest niewidoczna.
  zrzut:
    nazwa: "&4Zrzut"
    blok: beczka
    model: "axon:zrzut"
    min-przedmiotow: 4
    loot:
      - {przedmiot: iron_ingot, ilosc: "6-16", szansa: 100}
      - {przedmiot: gold_ingot, ilosc: "2-6", szansa: 60}
      - {przedmiot: diamond, ilosc: "1-3", szansa: 35}
      - {przedmiot: golden_apple, ilosc: "1-2", szansa: 40}
      - {przedmiot: iron_chestplate, ilosc: "1", szansa: 30}
      - {przedmiot: iron_helmet, ilosc: "1", szansa: 30}
      - {przedmiot: crossbow, ilosc: "1", szansa: 25}
      - {przedmiot: gunpowder, ilosc: "4-10", szansa: 50}
      - {przedmiot: cooked_beef, ilosc: "6-12", szansa: 70, nazwa: "&fRacja żywnościowa"}

  zielona-karta:
    nazwa: "&aZielona karta dostępu"
    blok: ramka
    loot:
      - przedmiot: paper
        ilosc: "1"
        szansa: 100
        nazwa: "&aZielona karta dostępu"
        opis:
          - "&7Poziom dostępu: 1"
