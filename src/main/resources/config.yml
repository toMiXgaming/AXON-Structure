  zielona-karta:
    nazwa: "&aZielona karta dostępu"
    blok: ramka
    loot:
      - przedmiot: paper
        ilosc: "1"
        szansa: 100
        nazwa: "&aZielona karta dostępu"
        opis:
          - "&7Poziom dostępu: 1"
