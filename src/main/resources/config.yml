# ============================================================
#  AXON-Structure – konfiguracja
#  Pliki struktur (*.axs) wrzuć do: plugins/AXON-Structure/struktury/
#  Po zmianach wpisz: /struktury przeladuj
#  Kolory w nazwach: &a, &6, &f itd.
# ============================================================

odswiezanie:
  # Co ile minut losować skrzynie na nowo.
  co-ile-minut: 20
  # Nie odświeżaj struktury, gdy jakiś gracz jest bliżej niż tyle bloków od jej środka (0 = wyłączone).
  blokada-gdy-gracz-blizej-niz: 32
  # false = losuj tylko puste i zniszczone skrzynie, pełne zostają; true = zawsze losuj od nowa.
  zastepuj-pelne: false

stawianie:
  # Ile bloków stawiać na tick (mniej = mniejsze lagi, dłużej trwa).
  bloki-na-tick: 4000
  # Szerokość pasa terenu wokół struktury, który łagodnie przechodzi do jej poziomu (bez klifów i rowów).
  wygladzanie-krawedzi: 6
  # Maks. głębokość dosypywania gruntu pod strukturą (łata dziury i jaskinie pod podłogą).
  maks-fundament: 24
  # Ile bloków ponad strukturą wycinać (drzewa, pagórki).
  czyszczenie-nad: 24

ochrona:
  # Gracze nie mogą niszczyć ani budować w obrębie struktury (cała wysokość świata, też pod ziemią).
  # Wolno: otwierać skrzynie, drzwi, przyciski i zabierać karty z ramek. PvP działa normalnie.
  # Admini z uprawnieniem axonstructure.bypass (domyślnie OP) mogą wszystko.
  wlaczona: true
  # Ile kratek wokół obrysu struktury też jest chronione.
  margines: 2
  # Minimalny odstęp (w kratkach) między strukturą a działką AxonPlot. Wymaga WorldGuarda.
  # Działa w obie strony: struktura nie powstanie przy działce, a działki nie da się założyć przy strukturze
  # (po stronie AxonPlot: placement.structure-buffer-blocks, ustaw tę samą wartość).
  odstep-od-dzialek: 50
  # Promień działki na najwyższym poziomie (AxonPlot: levels.*.radius). Działki rosną, więc liczy się największy.
  promien-dzialki: 25
  komunikat: "&cTej struktury nie można niszczyć ani rozbudowywać."
  # Flagi regionu WorldGuard struktura_<id>. Niszczenie blokuje sam plugin, więc passthrough zostaje
  # na allow (inaczej WorldGuard zablokowałby też otwieranie skrzyń), a pvp na allow włącza walkę.
  flagi-worldguard:
    pvp: allow
    passthrough: allow

auto-generowanie:
  wlaczone: true
  # Światy, w których struktury pojawiają się same.
  swiaty:
    - world
  # Szansa (w %) na próbę postawienia przy każdym NOWO wygenerowanym chunku.
  szansa-procent: 0.5
  # Minimalna odległość (w blokach) między dwiema strukturami.
  min-odleglosc-miedzy: 1000
  # Minimalna odległość od spawnu świata.
  min-odleglosc-od-spawnu: 300
  # Maks. różnica wysokości terenu pod strukturą. Większa = struktura stanie też na pagórkach.
  maks-roznica-wysokosci: 6
  # Maks. udział wody/lawy/lodu pod strukturą w %.
  maks-woda-procent: 3
  # Które struktury i jak często (wagi). Puste {} = wszystkie wczytane po równo.
  # Przykład:
  #   struktury:
  #     stacja: 3
  #     magazyn: 1
  struktury: {}

zrzuty:
  # Kilka razy dziennie, o losowej porze w podanych godzinach, nad jedną z postawionych struktur spada
  # na spadochronie skrzynia z rzadkim lootem. Miejsca zrzutów są w plikach struktur (lądowisko jednostki,
  # dach szpitala). Komenda: /struktury zrzut (od razu), /struktury zrzut info (o której następny).
  wlaczone: true
  # Ile zrzutów dziennie. Okno godzin dzielone jest na tyle równych części, w każdej jeden zrzut o losowej porze
  # (przy 2 i 12-22: raz między 12 a 17, raz między 17 a 22).
  dziennie: 2
  godziny-od: 12
  godziny-do: 22
  strefa-czasowa: Europe/Warsaw
  # Zrzut tylko, gdy online jest co najmniej tylu graczy (czeka do końca swojej części okna, potem przepada).
  min-graczy: 2
  # Pula lootu (sekcja pule:) i zarazem nazwa miejsc zrzutu w plikach .axs.
  pula: zrzut
  # Po ilu minutach nieopróżniona skrzynia znika.
  znika-po-minutach: 15
  wysokosc-spadania: 40
  czas-spadania-sekund: 10
  nazwa-skrzyni: "&4&lZrzut zaopatrzenia"
  # {nazwa} = nazwa struktury, {x} {y} {z} = współrzędne, {minuty} = znika-po-minutach. "" = bez komunikatu.
  # Domyślnie komunikat nie zdradza miejsca: wie to tylko radiostacja w oazie (za opłatą, sekcja oaza.radio).
  # Miejsce w komunikacie: "&4&l[ZRZUT] &fNad strukturą &e{nazwa} &fspada skrzynia z zaopatrzeniem! &7({x}, {y}, {z})"
  komunikat: "&4&l[ZRZUT] &fNad jedną ze struktur spada skrzynia z zaopatrzeniem! &7Gdzie? Radiostacja w oazie wie."
  komunikat-wyladowal: "&4&l[ZRZUT] &fSkrzynia wylądowała. Zniknie za &e{minuty} min&f."
  komunikat-zniknal: "&4&l[ZRZUT] &7Nikt nie zabrał zrzutu, skrzynia zniknęła."

straznicy:
  # Strażnicy NPC w strukturach (żołnierze w jednostce, szabrownicy w szpitalu). Wymagają pluginów Citizens
  # i Sentinel (darmowe: ci.citizensnpcs.co). Broń z QualityArmory: "qa:<nazwa broni z QA>"; gdy QA jej nie zna,
  # strażnik dostaje kuszę. Bez Citizens i Sentinela miejsca strażników zostają puste.
  # Komenda: /struktury straznicy (ilu stoi), /struktury straznicy postaw (od razu, bez czekania na graczy).
  wlaczeni: true
  # Strażnicy pojawiają się, gdy gracz podejdzie bliżej niż tyle bloków do środka struktury,
  # i znikają, gdy nikogo nie ma w 1,5 × tej odległości (nie obciążają serwera, gdy nikt nie gra w okolicy).
  promien-aktywacji: 64
  # Po ilu minutach zabity strażnik wraca na swoje miejsce.
  odradzanie-minut: 10
  zestawy:
    zolnierz:
      nazwa: "&2Żołnierz"
      # Skin z mineskin.org: "Texture Value" i "Texture Signature". Albo skin-gracza: nick gracza z takim skinem.
      skin-tekstura: ""
      skin-podpis: ""
      skin-gracza: ""
      bron: "qa:ak47"
      # hełm, napierśnik, spodnie, buty
      zbroja: [iron_helmet, chainmail_chestplate, chainmail_leggings, iron_boots]
      zycie: 30
      # -1 = obrażenia broni
      obrazenia: -1
      # z jakiej odległości widzi i strzela
      zasieg: 28
      # rozrzut strzałów: 0 = idealnie celny, im więcej, tym częściej pudłuje
      celnosc: 2.5
      # klasa skrzyni (sekcja klasy:), z której losuje się loot po zabiciu; "" = nic
      loot: lepsza-skrzynia
      # do kogo strzela: players (gracze), monsters (potwory); [] = nie walczy wcale
      cele: [players]
    szabrownik:
      nazwa: "&6Szabrownik"
      skin-tekstura: ""
      skin-podpis: ""
      skin-gracza: ""
      bron: "qa:remington"
      zbroja: [leather_helmet, leather_chestplate, air, leather_boots]
      zycie: 24
      obrazenia: -1
      zasieg: 20
      celnosc: 4
      loot: mala-skrzynka
      # do kogo strzela: players (gracze), monsters (potwory); [] = nie walczy wcale
      cele: [players]
    ochroniarz:
      # strażnik oazy: broni przed potworami, do graczy nie strzela i nie da się go zranić
      nazwa: "&aOchrona Oazy"
      skin-tekstura: ""
      skin-podpis: ""
      skin-gracza: ""
      bron: "qa:m4a1"
      zbroja: [iron_helmet, iron_chestplate, leather_leggings, iron_boots]
      zycie: 40
      obrazenia: -1
      zasieg: 24
      celnosc: 1.5
      loot: ""
      cele: [monsters]
    handlarz:
      # handlarz w sklepie oazy (punkt-handlarz): stoi za ladą, prawy klik otwiera sklep
      nazwa: "&6Handlarz Zdzich"
      skin-tekstura: ""
      skin-podpis: ""
      skin-gracza: ""
      bron: ""
      zbroja: [air, leather_chestplate, air, air]
      zycie: 20
      obrazenia: -1
      zasieg: 0
      celnosc: 0
      loot: ""
      cele: []

oaza:
  # Oaza Świt (struktura "oaza"): strefa bez PvP, stawiana tylko komendą (/struktury generuj oaza), nigdy sama.
  # W jej obrysie gracze nie zranią się nawzajem, a strażnicy (zestaw ochroniarz) strzelają tylko do potworów.
  # Płatne rzeczy (sklep, zlecenia, automaty, radio) biorą pieniądze z pluginu ekonomii przez Vault.
  # Dane graczy: plugins/AXON-Structure/oaza.yml. Komendy: /oaza (dla graczy), /struktury oaza (stan).
  wlaczona: true
  tytul-wejscie: "&a&lOaza Świt"
  podtytul-wejscie: "&7Strefa bez przemocy. Broń w kaburze."
  tytul-wyjscie: "&c&lOpuszczasz oazę"
  podtytul-wyjscie: "&7Dalej już strzelają."
  komunikat-pvp: "&cW oazie się nie strzela do ludzi."
  sklep:
    nazwa: "&6Sklep u Zdzicha"
    # przedmiot: nazwa z Minecrafta albo qa:<broń z QualityArmory>; ilosc: ile w jednej paczce;
    # kupno: cena dla gracza (0 = nie sprzedaje), skup: ile handlarz płaci (0 = nie skupuje). Do 45 towarów.
    oferty:
      - {przedmiot: bread, ilosc: 8, kupno: 40, skup: 10}
      - {przedmiot: cooked_beef, ilosc: 8, kupno: 80, skup: 20}
      - {przedmiot: golden_apple, ilosc: 1, kupno: 400, skup: 100}
      - {przedmiot: torch, ilosc: 16, kupno: 30, skup: 0}
      - {przedmiot: oak_planks, ilosc: 32, kupno: 60, skup: 10}
      - {przedmiot: iron_ingot, ilosc: 8, kupno: 240, skup: 60}
      - {przedmiot: gold_ingot, ilosc: 4, kupno: 300, skup: 80}
      - {przedmiot: diamond, ilosc: 1, kupno: 600, skup: 150}
      - {przedmiot: leather_chestplate, ilosc: 1, kupno: 120, skup: 20}
      - {przedmiot: iron_chestplate, ilosc: 1, kupno: 900, skup: 150}
      - {przedmiot: iron_helmet, ilosc: 1, kupno: 550, skup: 90}
      - {przedmiot: shield, ilosc: 1, kupno: 200, skup: 30}
      - {przedmiot: bow, ilosc: 1, kupno: 150, skup: 25}
      - {przedmiot: arrow, ilosc: 32, kupno: 80, skup: 10}
      - {przedmiot: crossbow, ilosc: 1, kupno: 250, skup: 40}
      - {przedmiot: ender_pearl, ilosc: 2, kupno: 300, skup: 60}
      - {przedmiot: experience_bottle, ilosc: 8, kupno: 200, skup: 0}
      # Bronie z QualityArmory (nazwy jak w Twoim QA):
      # - {przedmiot: "qa:ak47", ilosc: 1, kupno: 3000, skup: 700}
  depozyt:
    # ile rzędów po 9 miejsc ma prywatny schowek (1-6); opłata za każde otwarcie (0 = darmowy)
    rzedy: 3
    oplata: 0
  zlecenia:
    # ile zleceń wisi naraz i co ile godzin losują się nowe; każdy gracz wykonuje każde raz na okres
    ile: 5
    odswiezanie-godzin: 24
    lista:
      - {przedmiot: iron_ingot, ilosc: 16, nagroda: 300}
      - {przedmiot: gold_ingot, ilosc: 8, nagroda: 350}
      - {przedmiot: coal, ilosc: 64, nagroda: 150}
      - {przedmiot: leather, ilosc: 24, nagroda: 200}
      - {przedmiot: wheat, ilosc: 64, nagroda: 120}
      - {przedmiot: oak_log, ilosc: 64, nagroda: 150}
      - {przedmiot: string, ilosc: 32, nagroda: 180}
      - {przedmiot: gunpowder, ilosc: 16, nagroda: 250}
      - {przedmiot: redstone, ilosc: 32, nagroda: 200}
      - {przedmiot: diamond, ilosc: 2, nagroda: 500}
      - {przedmiot: rotten_flesh, ilosc: 48, nagroda: 100}
      - {przedmiot: bone, ilosc: 32, nagroda: 120}
  automaty:
    # stawka za jedną grę; 3 takie same symbole = stawka × mnoznik, 2 takie same = stawka × para-mnoznik
    stawka: 50
    para-mnoznik: 0.5
    symbole:
      - {przedmiot: coal, waga: 10, mnoznik: 3}
      - {przedmiot: iron_ingot, waga: 6, mnoznik: 5}
      - {przedmiot: gold_ingot, waga: 3, mnoznik: 10}
      - {przedmiot: emerald, waga: 2, mnoznik: 20}
      - {przedmiot: diamond, waga: 1, mnoznik: 100}
  radio:
    # ile kosztuje namiar na najbliższy zrzut (nad czym i o której spadnie)
    cena: 500
  strzelnica:
    # seria trwa tyle sekund od pierwszego trafienia; dalsza tarcza = więcej punktów (1 + co 10 bloków)
    czas-serii-sekund: 60
    # najlepszy wynik tygodnia dostaje tyle pieniędzy (wypłata w poniedziałek)
    nagroda-tygodnia: 1000

# ------------------------------------------------------------
#  PULE – w pliku struktury każde miejsce na skrzynię ma nazwę puli.
#  Pula losuje klasę skrzyni według wag. "brak" = w tym miejscu nic się nie pojawi.
# ------------------------------------------------------------
pule:
  paliwo:
    beczka-paliwa: 65
    beczka: 20
    brak: 15
  plac:
    beczka: 65
    beczka-paliwa: 10
    brak: 25
  lada:
    skrzynka-jedzenie: 70
    brazowa: 15
    brak: 15
  karta:
    zielona-karta: 85
    brak: 15
  sklep:
    skrzynka-jedzenie: 40
    brazowa: 35
    brak: 25
  lodowki:
    skrzynka-medyczna: 45
    skrzynka-jedzenie: 35
    brak: 20
  toalety:
    skrzynka-medyczna: 45
    skrzynka-jedzenie: 30
    brak: 25
  zaplecze:
    brazowa: 45
    skrzynka-medyczna: 20
    skrzynka-jedzenie: 15
    brak: 20
  magazyn-regal:
    brazowa: 70
    narzedziowa: 15
    brak: 15
  magazyn:
    beczka: 60
    brazowa: 15
    brak: 25
  dach:
    brazowa: 45
    narzedziowa: 35
    brak: 20
  # --- gospodarstwo Agro-Pol (beczki na podwórzu i przy bece paliwowej: pule plac i paliwo) ---
  # parter domu
  parter:
    mala-skrzynka: 50
    skrzynka-jedzenie: 25
    skrzynka-medyczna: 10
    brak: 15
  # klepisko stodoły
  klepisko:
    mala-skrzynka: 55
    narzedziowa: 15
    brak: 30
  # strych stodoły (parkour po kombajnie)
  strych:
    lepsza-skrzynia: 70
    brazowa: 15
    brak: 15
  # piętro domu (przez szopę i balkon)
  pietro:
    lepsza-skrzynia: 70
    skrzynka-medyczna: 15
    brak: 15
  # szczyt silosu – pojedyncza rzadka skrzynia
  silos:
    rzadka-skrzynia: 90
    lepsza-skrzynia: 10
  # --- kombinat Przyszłość (beczki: plac, paliwo; małe skrzynki: parter, klepisko; piętro paszarni: strych) ---
  # magazyn nawozów – jedyne pewne skrzynki medyczne
  magazyn-nawozow:
    skrzynka-medyczna: 60
    narzedziowa: 25
    brak: 15
  # pomost suwnicy w bazie maszynowej
  suwnica:
    lepsza-skrzynia: 65
    narzedziowa: 20
    brak: 15
  # pomost wieży ciśnień
  wieza:
    lepsza-skrzynia: 75
    brazowa: 10
    brak: 15
  # maszynownia na szczycie wieży elewatora – dwie rzadkie skrzynie
  elewator:
    rzadka-skrzynia: 85
    lepsza-skrzynia: 15
  # --- kopalnia Jedność (beczki: plac, paliwo; cechownia i portiernia: parter; najwyższe piętro sortowni: strych) ---
  # sztolnia w hałdzie – skrzynki narzędziowe w komorze na końcu chodnika
  sztolnia:
    narzedziowa: 60
    mala-skrzynka: 15
    brak: 25
  # podszybie i komora pomp pod ziemią (jedyne wyjście to drabina w szybie)
  podszybie:
    narzedziowa: 55
    mala-skrzynka: 15
    lepsza-skrzynia: 10
    brak: 20
  # skład materiałów wybuchowych za kratą w podszybiu
  podszybie-sklad:
    lepsza-skrzynia: 75
    narzedziowa: 10
    brak: 15
  # pulpit maszynisty w maszynowni wyciągowej
  maszynownia:
    lepsza-skrzynia: 70
    narzedziowa: 15
    brak: 15
  # budka na szczycie wieży szybowej
  wieza-szybowa:
    rzadka-skrzynia: 90
    lepsza-skrzynia: 10
  # --- jednostka wojskowa (beczki: plac, paliwo; koszary, kantyna, magazyny: parter, lada, klepisko;
  #     strych garaży i regały magazynu sprzętu: strych; wieża desantowa na torze przeszkód: wieza) ---
  # izba chorych – szafki z lekami
  izba-chorych:
    skrzynka-medyczna: 70
    mala-skrzynka: 10
    brak: 20
  # gabinet dowódcy i kancelaria tajna w sztabie
  sztab:
    lepsza-skrzynia: 55
    skrzynia-broni: 15
    brazowa: 15
    brak: 15
  # cztery wieże wartownicze w rogach ogrodzenia
  wieze-wartownicze:
    skrzynia-broni: 45
    lepsza-skrzynia: 35
    brak: 20
  # wrak Mi-8 na lądowisku
  wrak:
    skrzynia-broni: 40
    skrzynka-medyczna: 30
    narzedziowa: 15
    brak: 15
  # kosz dźwigu nad placem
  dzwig:
    lepsza-skrzynia: 70
    narzedziowa: 15
    brak: 15
  # schron, poziom 1 – sala dowodzenia i pokój szyfranta
  schron-1:
    lepsza-skrzynia: 50
    skrzynia-broni: 25
    skrzynka-medyczna: 10
    brak: 15
  # bunkry magazynu uzbrojenia za siatką
  magazyn-broni:
    skrzynia-broni: 60
    brazowa: 20
    brak: 20
  # zbrojownia za kratą na poziomie 2 schronu
  zbrojownia:
    skrzynia-broni: 80
    lepsza-skrzynia: 10
    brak: 10
  # pomost na szczycie komina kotłowni
  komin:
    rzadka-skrzynia: 85
    lepsza-skrzynia: 15
  # kabina wieży kontroli lotów
  wieza-lotow:
    rzadka-skrzynia: 85
    skrzynia-broni: 15
  # skarbiec na dnie schronu (tylko przez szyb wentylacyjny)
  skarbiec:
    rzadka-skrzynia: 100
  # --- szpital Pod Lipami (beczki: plac; sale i gabinety: parter, izba-chorych; kuchnia: lada) ---
  # apteka szpitalna (tylko kanałem wentylacyjnym z dachu pawilonu)
  apteka:
    lepsza-skrzynia: 45
    skrzynka-medyczna: 45
    brak: 10
  # blok operacyjny (tylko łącznikiem z 1 piętra)
  blok-operacyjny:
    lepsza-skrzynia: 55
    skrzynka-medyczna: 30
    brak: 15
  # gabinet dyrektora na 4 piętrze (szyb windy albo właz z dachu)
  dyrekcja:
    lepsza-skrzynia: 75
    brazowa: 10
    brak: 15
  # kostnica w piwnicy
  kostnica:
    lepsza-skrzynia: 60
    skrzynka-medyczna: 20
    brak: 20
  # lądowisko na dachu
  ladowisko:
    rzadka-skrzynia: 85
    lepsza-skrzynia: 15
  # zrzut zaopatrzenia (sekcja zrzuty: wskazuje tę pulę)
  zrzut:
    rzadka-skrzynia: 75
    skrzynia-broni: 25

# ------------------------------------------------------------
#  KLASY SKRZYŃ
#  blok: skrzynia | beczka | ramka (ramka = przedmiot w ramce, np. karta dostępu)
#  dekoracja: blok stawiany na wieku (np. czerwona świeczka na beczce paliwa), "" = brak
#  min-przedmiotow: gdy nic nie wylosuje się z szans, dobierz tyle losowych pozycji
#  loot: każda pozycja losowana osobno
#    przedmiot: nazwa z Minecrafta (np. iron_ingot)
#    ilosc: "4-14" albo "1"
#    szansa: w % (0-100)
#    nazwa / opis: opcjonalna nazwa i opis przedmiotu
# ------------------------------------------------------------
klasy:
  beczka:
    nazwa: "&6Beczka"
    blok: beczka
    min-przedmiotow: 1
