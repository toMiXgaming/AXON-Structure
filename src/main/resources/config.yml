        - {przedmiot: "axon:steel", ilosc: "3-6", szansa: 60}
        - {przedmiot: "axon:gunpowder", ilosc: "3-6", szansa: 35}
        - {przedmiot: "axon:tech_notes", ilosc: "1-2", szansa: 25}
        - {przedmiot: "axon:repair_kit", ilosc: "1", szansa: 15}
        - {przedmiot: "axon:body_smg", ilosc: "1", szansa: 8}
