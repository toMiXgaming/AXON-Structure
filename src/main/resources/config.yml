# ============================================================
#  AXON-Structure – konfiguracja
#  Pliki struktur (*.axs) wrzuć do: plugins/AXON-Structure/struktury/
#  Po zmianach wpisz: /struktury przeladuj
#  Kolory w nazwach: &a, &6, &f itd.
# ============================================================

odswiezanie:
  # Co ile minut losować skrzynie na nowo.
  co-ile-minut: 20
  # Nie odświeżaj struktury, gdy jakiś gracz jest bliżej niż tyle bloków od jej środka (0 = wyłączone).
  blokada-gdy-gracz-blizej-niz: 32
  # false = losuj tylko puste i zniszczone skrzynie, pełne zostają; true = zawsze losuj od nowa.
  zastepuj-pelne: false

# ------------------------------------------------------------
#  ZRZUTY ZAOPATRZENIA
#  Skrzynia-model z tabeli "zrzut" (AxonItems/loot.yml) spada w losowym
#  punkcie w promieniu od spawnu świata. Gracz może też wezwać zrzut
#  komendą /struktury zrzut [promień] – wtedy punkt losuje się wokół niego.
# ------------------------------------------------------------
zrzuty:
  wlaczone: true
  # Światy, w których timer stawia zrzuty automatycznie.
  swiaty:
    - world
  # Co ile minut automatyczny zrzut (0 = timer wyłączony, zostaje tylko komenda).
  co-ile-minut: 90
  # Promień losowania od spawnu świata (w blokach).
  promien: 500
  # Najmniejszy promień – zrzut nie spadnie na głowę temu, kto go wzywa.
  min-promien: 120
  # Ogłoszenie na czacie tylko dla graczy w tym promieniu od zrzutu (0 = wszyscy w świecie).
  ogloszenie-promien: 0

stawianie:
  # Ile bloków stawiać na tick (mniej = mniejsze lagi, dłużej trwa).
  bloki-na-tick: 4000
  # Szerokość pasa terenu wokół struktury, który łagodnie przechodzi do jej poziomu (bez klifów i rowów).
  wygladzanie-krawedzi: 6
  # Maks. głębokość dosypywania gruntu pod strukturą (łata dziury i jaskinie pod podłogą).
  maks-fundament: 24
  # Ile bloków ponad strukturą wycinać (drzewa, pagórki).
  czyszczenie-nad: 24

ochrona:
  # Gracze nie mogą niszczyć ani budować w obrębie struktury (cała wysokość świata, też pod ziemią).
  # Wolno: otwierać skrzynie, drzwi, przyciski i zabierać karty z ramek. PvP działa normalnie.
  # Admini z uprawnieniem axonstructure.bypass (domyślnie OP) mogą wszystko.
  wlaczona: true
  # Ile kratek wokół obrysu struktury też jest chronione.
  margines: 2
  # Minimalny odstęp (w kratkach) między strukturą a działką AxonPlot. Wymaga WorldGuarda.
  # Działa w obie strony: struktura nie powstanie przy działce, a działki nie da się założyć przy strukturze
  # (po stronie AxonPlot: placement.structure-buffer-blocks, ustaw tę samą wartość).
  odstep-od-dzialek: 50
  # Promień działki na najwyższym poziomie (AxonPlot: levels.*.radius). Działki rosną, więc liczy się największy.
  promien-dzialki: 25
  komunikat: "&cTej struktury nie można niszczyć ani rozbudowywać."
  # Flagi regionu WorldGuard struktura_<id>. Niszczenie blokuje sam plugin, więc passthrough zostaje
  # na allow (inaczej WorldGuard zablokowałby też otwieranie skrzyń), a pvp na allow włącza walkę.
  flagi-worldguard:
    pvp: allow
    passthrough: allow

auto-generowanie:
  wlaczone: true
  # Światy, w których struktury pojawiają się same.
  swiaty:
    - world
  # Szansa (w %) na próbę postawienia przy każdym NOWO wygenerowanym chunku.
  szansa-procent: 0.5
  # Minimalna odległość (w blokach) między dwiema strukturami.
  min-odleglosc-miedzy: 1000
  # Minimalna odległość od spawnu świata.
  min-odleglosc-od-spawnu: 300
  # Maks. różnica wysokości terenu pod strukturą. Większa = struktura stanie też na pagórkach.
  maks-roznica-wysokosci: 6
  # Maks. udział wody/lawy/lodu pod strukturą w %.
  maks-woda-procent: 3
  # Które struktury i jak często (wagi). Puste {} = wszystkie wczytane po równo.
  # Przykład:
  #   struktury:
  #     stacja: 3
  #     magazyn: 1
  struktury: {}

# ------------------------------------------------------------
#  PULE – w pliku struktury każde miejsce na skrzynię ma nazwę puli.
#  Pula losuje klasę skrzyni według wag. "brak" = w tym miejscu nic się nie pojawi.
# ------------------------------------------------------------
pule:
  paliwo:
    beczka-paliwa: 65
    beczka: 20
    brak: 15
  plac:
    beczka: 65
    beczka-paliwa: 10
    brak: 25
  # Pula dla beczek stawianych przy drogach przez AXONMAPGENERATOR.
  droga:
    beczka-przydrozna: 80
    beczka: 15
    brak: 5
  lada:
    skrzynka-jedzenie: 70
    brazowa: 15
    brak: 15
  karta:
    zielona-karta: 85
    brak: 15
  sklep:
    skrzynka-jedzenie: 40
    brazowa: 35
    brak: 25
  lodowki:
    skrzynka-medyczna: 45
    skrzynka-jedzenie: 35
    brak: 20
  toalety:
    skrzynka-medyczna: 45
    skrzynka-jedzenie: 30
    brak: 25
  zaplecze:
    brazowa: 45
    skrzynka-medyczna: 20
    skrzynka-jedzenie: 15
    brak: 20
  magazyn-regal:
    brazowa: 70
    narzedziowa: 15
    brak: 15
  magazyn:
    beczka: 60
    brazowa: 15
    brak: 25
  dach:
    brazowa: 45
    narzedziowa: 35
    brak: 20
  # Pula dla skrzyń wojskowych w strefach PvP (bazy wojskowe, posterunki).
  # Skrzynia wojskowa odradza się co 30 min i ogłasza na czacie nazwę strefy.
  wojskowa:
    skrzynia-wojskowa: 80
    brak: 20
  # Pula dla zrzutów zaopatrzenia (/struktury zrzut i automatyczny timer).
  # Zrzut to zawsze pojemnik-model z tabeli "zrzut" w AxonItems/loot.yml.
  zrzut:
    zrzut-zaopatrzenia: 100

# ------------------------------------------------------------
#  KLASY SKRZYŃ
#  blok: skrzynia | beczka | ramka | model
#        (ramka = przedmiot w ramce, np. karta dostępu;
#         model = pojemnik-model: ItemDisplay + Interaction, bez prawdziwego bloku)
#  dekoracja: blok stawiany na wieku (np. czerwona świeczka na beczce paliwa), "" = brak
#  min-przedmiotow: gdy nic nie wylosuje się z szans, dobierz tyle losowych pozycji
#  model: nazwa modelu z paczki dla bloku: model (domyślnie id klasy)
#  strefa: nazwa strefy do ogłoszenia na czacie, gdy skrzynia się pojawi ("" = bez ogłoszenia)
#  odswiezanie-minut: własny interwał odświeżania w minutach (0 = globalny z odswiezanie.co-ile-minut)
#  loot: każda pozycja losowana osobno
#    przedmiot: nazwa z Minecrafta (np. iron_ingot) ALBO przedmiot AxonCore (axon:scrap)
#    tabela: id tabeli lootu z AxonItems/loot.yml (np. beczka_przydrozna) – cała tabela naraz
#    ilosc: "4-14" albo "1"
#    szansa: w % (0-100)
#    nazwa / opis: opcjonalna nazwa i opis przedmiotu (tylko dla przedmiotów z Minecrafta)
#
#  Przedmioty axon:* i tabele działają tylko, gdy AxonItems jest zainstalowany.
#  Bez AxonItems wpisy axon:*/tabela: są pomijane, a skrzynia dostaje resztę lootu.
# ------------------------------------------------------------
klasy:
  # Beczka przy drodze – serce etapu 4. Cały loot pochodzi z tabeli AxonItems,
  # więc szanse, ilości i próg dnia wipe'u (od-dnia) trzymamy w jednym miejscu: loot.yml.
  beczka-przydrozna:
    nazwa: "&6Beczka przy drodze"
    blok: beczka
    min-przedmiotow: 1
    loot:
      - {tabela: beczka_przydrozna, szansa: 100}

  beczka:
    nazwa: "&6Beczka"
    blok: beczka
    min-przedmiotow: 1
    loot:
      - {tabela: beczka_przydrozna, szansa: 100}

  beczka-paliwa:
    nazwa: "&cBeczka paliwa"
    blok: beczka
    dekoracja: "red_candle[candles=1,lit=false]"
    min-przedmiotow: 1
    loot:
      - {przedmiot: coal, ilosc: "4-12", szansa: 100, nazwa: "&fPaliwo niskiej jakości"}
      - {przedmiot: charcoal, ilosc: "2-6", szansa: 50}
      - {przedmiot: axon:scrap, ilosc: "2-6", szansa: 40}
      - {przedmiot: lava_bucket, ilosc: "1", szansa: 8, nazwa: "&fRopa naftowa"}
      - {przedmiot: blaze_powder, ilosc: "1", szansa: 5}

  brazowa:
    nazwa: "&6Brązowa skrzynia"
    blok: skrzynia
    min-przedmiotow: 2
    loot:
      - {przedmiot: axon:scrap, ilosc: "6-20", szansa: 100}
      - {przedmiot: axon:metal_fragments, ilosc: "3-8", szansa: 55}
      - {przedmiot: axon:steel, ilosc: "1-3", szansa: 30}
      - {przedmiot: axon:screw, ilosc: "2-5", szansa: 30}
      - {przedmiot: axon:rivet, ilosc: "2-6", szansa: 25}
      - {przedmiot: axon:pipe, ilosc: "1-2", szansa: 20}
      - {przedmiot: axon:spring, ilosc: "1-2", szansa: 18}
      - {przedmiot: axon:cloth, ilosc: "1-3", szansa: 20}
      - {przedmiot: axon:gunpowder, ilosc: "1-2", szansa: 15}
      - {przedmiot: torch, ilosc: "2-8", szansa: 30}
      - {przedmiot: arrow, ilosc: "4-12", szansa: 30}
      - {przedmiot: bow, ilosc: "1", szansa: 10}
      - {przedmiot: leather_chestplate, ilosc: "1", szansa: 10}
      - {przedmiot: crossbow, ilosc: "1", szansa: 5}

  skrzynka-jedzenie:
    nazwa: "&aSkrzynka z jedzeniem"
    blok: beczka
    min-przedmiotow: 1
    loot:
      - {przedmiot: bread, ilosc: "1-3", szansa: 60}
      - {przedmiot: apple, ilosc: "1-4", szansa: 50}
      - {przedmiot: baked_potato, ilosc: "1-3", szansa: 40}
      - {przedmiot: carrot, ilosc: "1-4", szansa: 40}
      - {przedmiot: dried_kelp, ilosc: "3-8", szansa: 30, nazwa: "&fSuszone wodorosty"}
      - {przedmiot: cookie, ilosc: "2-6", szansa: 30}
      - {przedmiot: mushroom_stew, ilosc: "1", szansa: 15, nazwa: "&fPuszka gulaszu"}
      - {przedmiot: honey_bottle, ilosc: "1", szansa: 10}
      - {przedmiot: golden_carrot, ilosc: "1-2", szansa: 8}

  skrzynka-medyczna:
    nazwa: "&bSkrzynka medyczna"
    blok: beczka
    min-przedmiotow: 1
    loot:
      - {przedmiot: paper, ilosc: "1-4", szansa: 60, nazwa: "&fBandaż"}
      - {przedmiot: honey_bottle, ilosc: "1-2", szansa: 40, nazwa: "&fSyrop"}
      - {przedmiot: string, ilosc: "1-3", szansa: 30, nazwa: "&fSzmata"}
      - {przedmiot: milk_bucket, ilosc: "1", szansa: 25}
      - {przedmiot: glistering_melon_slice, ilosc: "1-2", szansa: 25, nazwa: "&fStrzykawka medyczna"}
      - {przedmiot: suspicious_stew, ilosc: "1", szansa: 15}
      - {przedmiot: golden_apple, ilosc: "1", szansa: 12, nazwa: "&fApteczka"}

  narzedziowa:
    nazwa: "&eSkrzynka narzędziowa"
    blok: skrzynia
    min-przedmiotow: 2
    loot:
      - {przedmiot: axon:scrap, ilosc: "8-24", szansa: 100}
      - {przedmiot: axon:metal_fragments, ilosc: "4-10", szansa: 70}
      - {przedmiot: axon:steel, ilosc: "2-5", szansa: 50}
      - {przedmiot: axon:pipe, ilosc: "1-3", szansa: 35}
      - {przedmiot: axon:spring, ilosc: "1-3", szansa: 30}
      - {przedmiot: axon:screw, ilosc: "3-8", szansa: 40}
      - {przedmiot: axon:rivet, ilosc: "3-8", szansa: 35}
      - {przedmiot: axon:gears, ilosc: "1-2", szansa: 20}
      - {przedmiot: axon:rusty_tools, ilosc: "1", szansa: 25}
      - {przedmiot: axon:repair_kit, ilosc: "1", szansa: 12}
      - {przedmiot: axon:steel_pickaxe, ilosc: "1", szansa: 10}
      - {przedmiot: axon:steel_axe, ilosc: "1", szansa: 10}
      - {przedmiot: axon:steel_shovel, ilosc: "1", szansa: 8}
      - {przedmiot: shears, ilosc: "1", szansa: 20}
      - {przedmiot: flint_and_steel, ilosc: "1", szansa: 20}
      - {przedmiot: compass, ilosc: "1", szansa: 10}
      - {przedmiot: spyglass, ilosc: "1", szansa: 10}
      - {przedmiot: crossbow, ilosc: "1", szansa: 8}

  zielona-karta:
    nazwa: "&aZielona karta dostępu"
    blok: ramka
    loot:
      - przedmiot: paper
        ilosc: "1"
        szansa: 100
        nazwa: "&aZielona karta dostępu"
        opis:
          - "&7Poziom dostępu: 1"

  # Skrzynia wojskowa – pojemnik-model w strefach PvP. Odradza się co 30 min
  # i ogłasza na czacie nazwę strefy. Cały loot pochodzi z tabeli skrzynia_wojskowa
  # w AxonItems/loot.yml (tam też są progi od-dnia: korpusy T2 od dnia 3, HQM od dnia 5).
  skrzynia-wojskowa:
    nazwa: "&4Skrzynia wojskowa"
    blok: model
    model: skrzynia_wojskowa
    strefa: "&6Baza wojskowa"
    odswiezanie-minut: 30
    min-przedmiotow: 2
    loot:
      - {tabela: skrzynia_wojskowa, szansa: 100}

  # Zrzut zaopatrzenia – pojemnik-model stawiany przez /struktury zrzut oraz
  # automatyczny timer (sekcja "zrzuty"). Cały loot pochodzi z tabeli "zrzut"
  # w AxonItems/loot.yml – najbogatszej tabeli w grze, z progami od-dnia,
  # więc pierwszy zrzut nie łamie progresji wipe'u.
  zrzut-zaopatrzenia:
    nazwa: "&6Zrzut zaopatrzenia"
    blok: model
    model: zrzut
    strefa: "&6Zrzut zaopatrzenia"
    min-przedmiotow: 3
    loot:
      - {tabela: zrzut, szansa: 100}
