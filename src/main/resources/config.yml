      - {przedmiot: iron_sword, ilosc: "1", szansa: 12}
      - {przedmiot: chainmail_chestplate, ilosc: "1", szansa: 10}
      - {przedmiot: iron_helmet, ilosc: "1", szansa: 10}
      - {przedmiot: iron_chestplate, ilosc: "1", szansa: 6}
      - {przedmiot: golden_apple, ilosc: "1", szansa: 8, nazwa: "&fApteczka"}

  rzadka-skrzynia:
    nazwa: "&5Rzadka skrzynia"
    blok: skrzynia
    min-przedmiotow: 3
    loot:
      - {przedmiot: iron_ingot, ilosc: "4-10", szansa: 100}
