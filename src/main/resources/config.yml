  sklepy:
    # stacja Oilen: kasa w sklepiku
    stacja:
      nazwa: "&eOilen &7– kasa"
      oferty:
        - {przedmiot: bread, ilosc: 4, kupno: 25, skup: 0}
        - {przedmiot: cookie, ilosc: 8, kupno: 20, skup: 0}
        - {przedmiot: torch, ilosc: 16, kupno: 35, skup: 0}
        - {przedmiot: lantern, ilosc: 1, kupno: 40, skup: 0}
        - {przedmiot: flint_and_steel, ilosc: 1, kupno: 60, skup: 0}
        - {przedmiot: coal, ilosc: 16, kupno: 60, skup: 15}
        - {przedmiot: lava_bucket, ilosc: 1, kupno: 250, skup: 0}
        - {przedmiot: map, ilosc: 1, kupno: 50, skup: 0}
    # automat z napojami (stacja, galeria, zajezdnia, osiedle)
    automat-napoje:
      nazwa: "&bAutomat z napojami"
      oferty:
        - {przedmiot: honey_bottle, ilosc: 1, kupno: 30, skup: 0}
        - {przedmiot: milk_bucket, ilosc: 1, kupno: 45, skup: 0}
        - {przedmiot: sweet_berries, ilosc: 8, kupno: 20, skup: 0}
        - {przedmiot: glow_berries, ilosc: 8, kupno: 30, skup: 0}
    # kiosk Ruchu przy drodze
    kiosk:
      nazwa: "&6Kiosk &7– prasa i drobiazgi"
      oferty:
        - {przedmiot: paper, ilosc: 16, kupno: 20, skup: 5}
        - {przedmiot: map, ilosc: 1, kupno: 40, skup: 0}
        - {przedmiot: book, ilosc: 1, kupno: 30, skup: 8}
        - {przedmiot: candle, ilosc: 4, kupno: 25, skup: 0}
        - {przedmiot: string, ilosc: 8, kupno: 25, skup: 6}
        - {przedmiot: cookie, ilosc: 8, kupno: 20, skup: 0}
        - {przedmiot: compass, ilosc: 1, kupno: 120, skup: 0}
    # opuszczony fastfood: frytkownica jeszcze działa
    fastfood:
      nazwa: "&cFastfood &7– okienko"
      oferty:
        - {przedmiot: cooked_beef, ilosc: 4, kupno: 45, skup: 0}
        - {przedmiot: cooked_chicken, ilosc: 4, kupno: 35, skup: 0}
        - {przedmiot: baked_potato, ilosc: 8, kupno: 30, skup: 0}
        - {przedmiot: mushroom_stew, ilosc: 1, kupno: 25, skup: 0}
        - {przedmiot: pumpkin_pie, ilosc: 2, kupno: 30, skup: 0}
        - {przedmiot: raw_beef, ilosc: 8, kupno: 0, skup: 20}
        - {przedmiot: potato, ilosc: 16, kupno: 0, skup: 12}
    # galeria handlowa: sklep sportowo-turystyczny
    galeria:
      nazwa: "&dGaleria &7– sport i turystyka"
      oferty:
        - {przedmiot: leather_helmet, ilosc: 1, kupno: 90, skup: 15}
        - {przedmiot: leather_chestplate, ilosc: 1, kupno: 140, skup: 20}
        - {przedmiot: leather_boots, ilosc: 1, kupno: 80, skup: 12}
        - {przedmiot: bow, ilosc: 1, kupno: 170, skup: 25}
        - {przedmiot: arrow, ilosc: 16, kupno: 50, skup: 6}
        - {przedmiot: fishing_rod, ilosc: 1, kupno: 70, skup: 10}
        - {przedmiot: shield, ilosc: 1, kupno: 220, skup: 30}
        - {przedmiot: spyglass, ilosc: 1, kupno: 180, skup: 0}
        - {przedmiot: bundle, ilosc: 1, kupno: 120, skup: 0}
    # zajezdnia: kolejarz skupuje złom i części (tylko skup)
    zajezdnia:
      nazwa: "&7Skup złomu &8– zajezdnia"
      oferty:
        - {przedmiot: iron_ingot, ilosc: 8, kupno: 0, skup: 55}
        - {przedmiot: iron_nugget, ilosc: 32, kupno: 0, skup: 20}
        - {przedmiot: copper_ingot, ilosc: 16, kupno: 0, skup: 40}
        - {przedmiot: rail, ilosc: 16, kupno: 0, skup: 30}
        - {przedmiot: chain, ilosc: 8, kupno: 0, skup: 25}
        - {przedmiot: redstone, ilosc: 16, kupno: 0, skup: 35}
        - {przedmiot: minecart, ilosc: 1, kupno: 150, skup: 40}

gui:
  # Okna oazy (sklep, automaty, wymiana, paser, tablica zleceń) jako pełnoekranowy ekran w stylu Rusta: obraz z map
  # w niewidzialnych ramkach, który shader z paczki zasobów serwera (ten sam co w AxonMap) rozciąga na cały ekran.
  # Kursor to mysz, LPM/PPM klikają, scroll przewija listy, Shift zamyka. Wymaga pluginu PacketEvents.
  # Tryb awaryjny: zwykłe okno skrzyni, gdy nie ma PacketEvents, shader: false, gracz nie wczytał paczki,
  # wybrał skrzynię (/oaza gui albo przycisk "Tryb skrzyni" na ekranie) albo nie da się go posadzić (pojazd, skok).
  # Depozyt zawsze jest skrzynią (przekłada się w nim przedmioty). Wybór graczy i numery map: gui.yml.
  shader: true
  # true = ekran tylko dla graczy, od których klient zgłosił wczytaną paczkę zasobów; false, gdy paczkę wysyła
  # proxy albo inny plugin i serwer tego nie widzi (wtedy gracz bez paczki zobaczy ramki z mapami zamiast ekranu)
  wymagaj-paczki: true

loot:
  # Loot jeszcze nieustalony: true = skrzynie i beczki stoją w strukturach, ale są puste, skrzynia zrzutu spada pusta
  # (i znika po czasie), zabici strażnicy nic nie dają, a ramek z kartami nie ma. Tabele (pule:, klasy:, loot
  # w zestawach strażników) zostają niżej na później – gdy będą gotowe, ustaw false i /struktury przeladuj.
  puste: true

# ------------------------------------------------------------
#  POJEMNIKI – skrzynie i beczki bez prawdziwego bloku: model z paczki zasobów serwera (QualityArmory-texturepack,
#  axon:<nazwa>, przód na południe) i niewidzialna encja, w którą się klika. Nie da się ich zabrać, rozbudować
#  ani nic w nich schować. Stoją w miejscach skrzyń w strukturach (pule niżej i w pule:) i przy drogach
#  (punkty podaje AxonMapGenerator). Stan jest tylko w pamięci: po restarcie wszystko losuje się od nowa.
#
#  Beczki (model-rozbity ustawiony): LPM rozbija beczkę, model zmienia się na rozbity, PPM otwiera loot (losowany
#  w chwili rozbicia). Rozbita znika, gdy jest pusta albo po rozbita-znika-po-minutach, i wraca w tym samym miejscu
#  po odnowienie-minut od rozbicia. Skrzynie (bez model-rozbity): PPM otwiera od razu, loot losuje się przy
#  pierwszym otwarciu, a po opróżnieniu wraca po odnowienie-minut.
#  Przedmioty "axon:<id>" tworzy plugin AxonItems (id z jego items.yml); bez niego te pozycje są pomijane.
#  Gdy loot.puste: true, pojemniki stoją i dają się rozbić, ale są puste.
# ------------------------------------------------------------
pojemniki:
  # Po ilu minutach pojemnik wraca (beczka: od rozbicia, skrzynia: od opróżnienia). Klasa może mieć własne odnowienie-minut.
  odnowienie-minut: 10
  # Po ilu minutach od rozbicia znika rozbita beczka, nawet z lootem w środku.
  rozbita-znika-po-minutach: 5
  # Nie odnawiaj, gdy gracz jest bliżej niż tyle bloków (0 = wyłączone).
  blokada-gdy-gracz-blizej-niz: 24
  przy-drogach:
    # Pula dla punktów przy drogach z AxonMapGenerator (drogi.beczki w jego configu).
    pula: droga

  pule:
    droga:
      beczka: 55
      beczka-rdza: 25
      beczka-paliwa: 15
      skrzynia-przydrozna: 5

  # Pola klasy jak w klasy: niżej, plus:
  #   blok: model
  #   model: model z paczki (axon:beczka)
  #   model-rozbity: model po rozbiciu; brak = skrzynia, którą otwiera się od razu
  #   uderzenia / uderzenia-narzedziem: ile uderzeń ręką / czymkolwiek w ręce, żeby rozbić (domyślnie 3 / 2)
  #   odnowienie-minut: własny czas odnowienia klasy
  #   ogloszenie: komunikat na czacie przy odnowieniu ({nazwa}, {miejsce}); "" = bez komunikatu
  #   dlugosc: ile bloków zajmuje (skrzynia wojskowa: 2); szerokosc / wysokosc: klikalny obszar w blokach
  klasy:
    # --- beczki (rozbijane): drogi, place, stacje paliw ---
    beczka:
      nazwa: "&9Beczka"
      blok: model
      model: "axon:beczka"
      model-rozbity: "axon:beczka_rozbita"
      min-przedmiotow: 1
      loot:
        # Cała tabela z loot.yml w AxonItems: tam są szanse i dni wipe'u (od-dnia).
        - {przedmiot: "tabela:beczka_przydrozna", szansa: 100}

    beczka-rdza:
      nazwa: "&6Zardzewiała beczka"
      blok: model
      model: "axon:beczka_rdza"
      model-rozbity: "axon:beczka_rdza_rozbita"
      min-przedmiotow: 1
      loot:
        - {przedmiot: "axon:scrap", ilosc: "1-5", szansa: 100}
        - {przedmiot: "axon:metal_fragments", ilosc: "3-8", szansa: 40}
        - {przedmiot: "axon:rusty_tools", ilosc: "1-2", szansa: 35}
        - {przedmiot: "axon:gears", ilosc: "1-2", szansa: 30}
        - {przedmiot: "axon:screw", ilosc: "1-3", szansa: 25}
        - {przedmiot: "axon:rivet", ilosc: "2-4", szansa: 20}
        - {przedmiot: "axon:pipe", ilosc: "1", szansa: 10}
        - {przedmiot: "axon:spring", ilosc: "1", szansa: 8}

    beczka-paliwa:
      nazwa: "&cBeczka z olejem"
      blok: model
      model: "axon:beczka_paliwa"
      model-rozbity: "axon:beczka_paliwa_rozbita"
      min-przedmiotow: 1
      loot:
        - {przedmiot: coal, ilosc: "4-12", szansa: 100, nazwa: "&fPaliwo niskiej jakości"}
        - {przedmiot: "axon:scrap", ilosc: "1-4", szansa: 40}
        - {przedmiot: "axon:metal_fragments", ilosc: "2-5", szansa: 20}

    # --- skrzynie (otwierane od razu) ---
    skrzynia-przydrozna:
      nazwa: "&7Skrzynka przydrożna"
      blok: model
      model: "axon:skrzynia_drewniana"
      min-przedmiotow: 1
      loot:
        - {przedmiot: "axon:scrap", ilosc: "3-8", szansa: 100}
        - {przedmiot: "axon:cloth", ilosc: "2-5", szansa: 35}
        - {przedmiot: "axon:screw", ilosc: "1-3", szansa: 30}
        - {przedmiot: "axon:rivet", ilosc: "2-4", szansa: 25}
        - {przedmiot: bread, ilosc: "1-2", szansa: 25}
        - {przedmiot: "axon:tech_notes", ilosc: "1", szansa: 4}

    brazowa:
      nazwa: "&6Skrzynia drewniana"
      blok: model
      model: "axon:skrzynia_drewniana"
      min-przedmiotow: 2
      loot:
        - {przedmiot: "axon:scrap", ilosc: "5-12", szansa: 100}
        - {przedmiot: "axon:screw", ilosc: "2-4", szansa: 30}
        - {przedmiot: "axon:rivet", ilosc: "2-5", szansa: 30}
        - {przedmiot: "axon:pipe", ilosc: "1", szansa: 12}
        - {przedmiot: "axon:spring", ilosc: "1", szansa: 10}
        - {przedmiot: "axon:stock", ilosc: "1", szansa: 10}
        - {przedmiot: "axon:steel", ilosc: "2-4", szansa: 25}
        - {przedmiot: "axon:cloth", ilosc: "2-6", szansa: 25}
        - {przedmiot: "axon:tech_notes", ilosc: "1", szansa: 8}
        - {przedmiot: "axon:body_smg", ilosc: "1", szansa: 4}
        - {przedmiot: "axon:body_semi", ilosc: "1", szansa: 4}

    mala-skrzynka:
      nazwa: "&7Mała drewniana skrzynka"
      blok: model
      model: "axon:skrzynia_drewniana"
      min-przedmiotow: 1
      loot:
        - {przedmiot: "axon:scrap", ilosc: "3-8", szansa: 100}
        - {przedmiot: "axon:cloth", ilosc: "2-5", szansa: 40}
        - {przedmiot: "axon:screw", ilosc: "1-3", szansa: 25}
        - {przedmiot: "axon:rivet", ilosc: "2-4", szansa: 20}
        - {przedmiot: "axon:rusty_tools", ilosc: "1", szansa: 20}
        - {przedmiot: wheat, ilosc: "2-6", szansa: 30}
        - {przedmiot: bread, ilosc: "1-2", szansa: 30}
        - {przedmiot: torch, ilosc: "2-6", szansa: 20}
        - {przedmiot: coal, ilosc: "1-4", szansa: 20}

    lepsza-skrzynia:
      nazwa: "&9Lepsza skrzynia"
      blok: model
      model: "axon:skrzynia_drewniana"
      min-przedmiotow: 2
      loot:
        - {przedmiot: "axon:scrap", ilosc: "8-16", szansa: 100}
        - {przedmiot: "axon:steel", ilosc: "2-5", szansa: 40}
        - {przedmiot: "axon:screw", ilosc: "2-5", szansa: 40}
        - {przedmiot: "axon:rivet", ilosc: "3-6", szansa: 35}
        - {przedmiot: "axon:pipe", ilosc: "1", szansa: 20}
        - {przedmiot: "axon:spring", ilosc: "1", szansa: 18}
        - {przedmiot: "axon:stock", ilosc: "1", szansa: 15}
        - {przedmiot: "axon:gunpowder", ilosc: "2-4", szansa: 20}
        - {przedmiot: "axon:tech_notes", ilosc: "1", szansa: 12}
        - {przedmiot: "axon:repair_kit", ilosc: "1", szansa: 8}
        - {przedmiot: "axon:body_pistol", ilosc: "1", szansa: 6}
        - {przedmiot: "axon:body_smg", ilosc: "1", szansa: 5}
        - {przedmiot: "axon:body_semi", ilosc: "1", szansa: 5}
        - {przedmiot: golden_apple, ilosc: "1", szansa: 8, nazwa: "&fApteczka"}

    rzadka-skrzynia:
      nazwa: "&5Rzadka skrzynia"
      blok: model
      model: "axon:skrzynia_drewniana"
      min-przedmiotow: 3
      loot:
