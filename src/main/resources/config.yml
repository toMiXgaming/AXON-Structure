    bandyta:
      # gang z galerii Kometa (npc-bandyta): twardsi od szabrowników, celniejsi, w kolczudze
      nazwa: "&cBandyta z Komety"
      skin-tekstura: ""
      skin-podpis: ""
      skin-gracza: ""
      bron: "qa:ak47"
      zbroja: [chainmail_helmet, chainmail_chestplate, leather_leggings, iron_boots]
      zycie: 34
      obrazenia: -1
      zasieg: 26
      celnosc: 0.7
      loot: lepsza-skrzynia
      cele: [players]
      chodzi: true
      promien-chodzenia: 10
    herszt:
      # herszt gangu (npc-herszt): biuro administracji galerii i liczarnia w garażu
      nazwa: "&4Herszt Komety"
      skin-tekstura: ""
      skin-podpis: ""
      skin-gracza: ""
      bron: "qa:m4a1s"
      zbroja: [iron_helmet, iron_chestplate, iron_leggings, iron_boots]
      zycie: 60
      obrazenia: -1
      zasieg: 32
      celnosc: 0.4
      loot: rzadka-skrzynia
      cele: [players]
      chodzi: true
      promien-chodzenia: 5

oaza:
  # Oaza Świt (struktura "oaza"): strefa bez PvP, stawiana tylko komendą (/struktury generuj oaza), nigdy sama.
  # W jej obrysie gracze nie zranią się nawzajem, a strażnicy (zestaw ochroniarz) strzelają tylko do potworów.
  # Płatne rzeczy (sklep, zlecenia, automaty, radio) biorą pieniądze z pluginu ekonomii przez Vault.
  # Dane graczy: plugins/AXON-Structure/oaza.yml. Komendy: /oaza (dla graczy), /struktury oaza (stan).
  wlaczona: true
  tytul-wejscie: "&a&lOaza Świt"
  podtytul-wejscie: "&7Strefa bez przemocy. Broń w kaburze."
  tytul-wyjscie: "&c&lOpuszczasz oazę"
  podtytul-wyjscie: "&7Dalej już strzelają."
  komunikat-pvp: "&cW oazie się nie strzela do ludzi."
  sklep:
    nazwa: "&6Sklep u Zdzicha"
    # przedmiot: nazwa z Minecrafta albo qa:<broń z QualityArmory>; ilosc: ile w jednej paczce;
    # kupno: cena dla gracza (0 = nie sprzedaje), skup: ile handlarz płaci (0 = nie skupuje). Do 45 towarów.
    oferty:
      - {przedmiot: bread, ilosc: 8, kupno: 40, skup: 10}
      - {przedmiot: cooked_beef, ilosc: 8, kupno: 80, skup: 20}
      - {przedmiot: golden_apple, ilosc: 1, kupno: 400, skup: 100}
      - {przedmiot: torch, ilosc: 16, kupno: 30, skup: 0}
      - {przedmiot: oak_planks, ilosc: 32, kupno: 60, skup: 10}
      - {przedmiot: iron_ingot, ilosc: 8, kupno: 240, skup: 60}
      - {przedmiot: gold_ingot, ilosc: 4, kupno: 300, skup: 80}
      - {przedmiot: diamond, ilosc: 1, kupno: 600, skup: 150}
      - {przedmiot: leather_chestplate, ilosc: 1, kupno: 120, skup: 20}
      - {przedmiot: iron_chestplate, ilosc: 1, kupno: 900, skup: 150}
      - {przedmiot: iron_helmet, ilosc: 1, kupno: 550, skup: 90}
      - {przedmiot: shield, ilosc: 1, kupno: 200, skup: 30}
      - {przedmiot: bow, ilosc: 1, kupno: 150, skup: 25}
      - {przedmiot: arrow, ilosc: 32, kupno: 80, skup: 10}
      - {przedmiot: crossbow, ilosc: 1, kupno: 250, skup: 40}
      - {przedmiot: ender_pearl, ilosc: 2, kupno: 300, skup: 60}
      - {przedmiot: experience_bottle, ilosc: 8, kupno: 200, skup: 0}
      # Bronie z QualityArmory (nazwy jak w Twoim QA):
      # - {przedmiot: "qa:ak47", ilosc: 1, kupno: 3000, skup: 700}
  depozyt:
    # ile rzędów po 9 miejsc ma prywatny schowek (1-6); opłata za każde otwarcie (0 = darmowy)
    rzedy: 3
    oplata: 0
  zlecenia:
    # ile zleceń wisi naraz i co ile godzin losują się nowe; każdy gracz wykonuje każde raz na okres
    ile: 5
    odswiezanie-godzin: 24
    lista:
      - {przedmiot: iron_ingot, ilosc: 16, nagroda: 300}
      - {przedmiot: gold_ingot, ilosc: 8, nagroda: 350}
      - {przedmiot: coal, ilosc: 64, nagroda: 150}
      - {przedmiot: leather, ilosc: 24, nagroda: 200}
      - {przedmiot: wheat, ilosc: 64, nagroda: 120}
      - {przedmiot: oak_log, ilosc: 64, nagroda: 150}
      - {przedmiot: string, ilosc: 32, nagroda: 180}
      - {przedmiot: gunpowder, ilosc: 16, nagroda: 250}
      - {przedmiot: redstone, ilosc: 32, nagroda: 200}
      - {przedmiot: diamond, ilosc: 2, nagroda: 500}
      - {przedmiot: rotten_flesh, ilosc: 48, nagroda: 100}
      - {przedmiot: bone, ilosc: 32, nagroda: 120}
  automaty:
    # stawka za jedną grę; 3 takie same symbole = stawka × mnoznik, 2 takie same = stawka × para-mnoznik
    # symbol z mnoznik: 0 to pudło (nie płaci nawet w parze). Przy tych wagach wygrywa ok. 31% gier,
    # a automat oddaje średnio ok. 59% stawek (reszta znika z ekonomii).
    stawka: 50
    para-mnoznik: 1.5
    symbole:
      - {przedmiot: dead_bush, waga: 10, mnoznik: 0}
      - {przedmiot: coal, waga: 8, mnoznik: 4}
      - {przedmiot: iron_ingot, waga: 5, mnoznik: 8}
      - {przedmiot: gold_ingot, waga: 3, mnoznik: 20}
      - {przedmiot: emerald, waga: 2, mnoznik: 40}
      - {przedmiot: diamond, waga: 1, mnoznik: 150}
  radio:
    # ile kosztuje namiar na najbliższy zrzut (nad czym i o której spadnie)
    cena: 500
  strzelnica:
    # seria trwa tyle sekund od pierwszego trafienia; dalsza tarcza = więcej punktów (1 + co 10 bloków)
    czas-serii-sekund: 60
    # najlepszy wynik tygodnia dostaje tyle pieniędzy (wypłata w poniedziałek)
    nagroda-tygodnia: 1000

czarny-rynek:
  # Kryjówki czarnego rynku (struktura "czarny-rynek") stawiają się same jak inne struktury i PvP w nich działa.
  # W piwnicy stoi paser (zestaw paser): klik w niego albo w beczkę-ladę przed nim otwiera towar.
  # Co odswiezanie-godzin paser losuje "ile" ofert z listy; ten sam towar jest we wszystkich kryjówkach.
  # przedmiot: nazwa z Minecrafta albo qa:<broń z QualityArmory>; ilosc: ile w paczce; cena: z Vaulta;
  # sztuk: ile paczek można kupić w jednym okresie na cały serwer (0 albo brak = bez limitu).
  wlaczony: true
  nazwa: "&8Paser &7– towar spod lady"
  ile: 4
  odswiezanie-godzin: 3
  lista:
    - {przedmiot: "qa:ak47", ilosc: 1, cena: 4500, sztuk: 2}
    - {przedmiot: "qa:m4a1s", ilosc: 1, cena: 5500, sztuk: 2}
    - {przedmiot: "qa:remington", ilosc: 1, cena: 3000, sztuk: 3}
    - {przedmiot: diamond_chestplate, ilosc: 1, cena: 4000, sztuk: 2}
    - {przedmiot: diamond_helmet, ilosc: 1, cena: 2500, sztuk: 2}
    - {przedmiot: totem_of_undying, ilosc: 1, cena: 6000, sztuk: 1}
    - {przedmiot: enchanted_golden_apple, ilosc: 1, cena: 5000, sztuk: 1}
    - {przedmiot: golden_apple, ilosc: 4, cena: 1200, sztuk: 5}
    - {przedmiot: ender_pearl, ilosc: 8, cena: 900, sztuk: 5}
    - {przedmiot: tnt, ilosc: 8, cena: 1500, sztuk: 3}
    - {przedmiot: netherite_scrap, ilosc: 2, cena: 3500, sztuk: 2}
    - {przedmiot: experience_bottle, ilosc: 32, cena: 1000, sztuk: 4}

stanowiska:
  # Sklepy, automaty i radia w zwykłych strukturach (poza oazą, więc PvP działa, a obrażenia zamykają ekran).
  # Otwierają się w tym samym pełnoekranowym GUI co oaza (sekcja gui:), a bez niego jako skrzynia.
  # Punkty w pliku struktury: punkt-sklep-<nazwa> (sklep z listy niżej), punkt-automat (jednoręki bandyta
  # z oaza.automaty) i punkt-radio (namiar na zrzut za oaza.radio.cena). Klika się blok punktu albo zaraz obok.
  # Format sklepu jak oaza.sklep: nazwa, oferty z przedmiotem, ilością, kupnem (0 = nie sprzedaje) i skupem
  # (0 = nie skupuje). Pieniądze z Vaulta.
