name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build generujStruktury --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AXON-Structure
          path: |
            build/libs/*.jar
            build/struktury/*.axs
      - name: Test na prawdziwym serwerze Paper
        run: .github/scripts/smoke-test.sh
      - name: Test strażników NPC (Citizens + Sentinel)
        run: .github/scripts/npc-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-server-log
          path: |
            smoke-server/server.log
            smoke-npc/server.log
          if-no-files-found: ignore
